<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L.A.P.S — エクスプローラー</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<!-- 別のウィンドウのエクスプローラー（2026-11-17 オーナー「変更とファイルを統一して VSCode みたいにして、ポップアウトできるように」）。
     中身はメインのウィンドウの右のパネルと同じ explorer.js（ここでは独りで動く）。git とファイルの読み書きは Rust の scm.rs・filepreview.rs。 -->
</head>
<body class="xwin">
  <header class="xwin__bar">
    <span class="xwin__title">エクスプローラー</span>
    <span class="xwin__ws" id="x-ws"></span>
    <span class="x-gap"></span>
    <button class="x-back" id="x-dock" type="button" title="メインのウィンドウの右のパネルに戻す">パネルに戻す</button>
  </header>
  <div class="xwin__main">
    <main class="xwin__root drawer__body" id="x-root" aria-label="エクスプローラー"></main>
    <section class="xwin__editor xe" id="editor" hidden aria-label="エディター"></section>
  </div>
  <p class="xwin__msg" id="x-msg" role="status" aria-live="polite" hidden></p>
  <script src="explorer.js"></script>
</body>
</html>
