<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>L.A.P.S Browser Bridge</title>
<link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>L.A.P.S Browser Bridge</h1>
  <p class="st" id="st">確かめています…</p>
  <label>合言葉（L.A.P.S の画面の「Chrome とつなぐ」か ~/.laps/chrome-bridge.json）<input id="token" type="password" autocomplete="off"></label>
  <label>ポート <input id="port" type="number" min="1024" max="65535"></label>
  <button id="save" type="button">保存してつなぐ</button>
  <p class="note">この PC の L.A.P.S（127.0.0.1）にだけつなぎます。操作中のタブには L.A.P.S の表示が出て、Chrome の「デバッグ中」の帯の × でいつでも切れます。</p>
  <script src="popup.js"></script>
</body></html>
